<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>M&amp;M Wedding Weekend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --ink: #1f2a24; --muted: #5d6b63; --line: #dfe3dc;
    --accent: #356854; --accent-ink: #ffffff; --accent-soft: #e6efe9; --band: #f7f9f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141a17; --surface: #1c2420; --ink: #e8ece9; --muted: #a3b0a8; --line: #2e3a34;
      --accent: #7fb59c; --accent-ink: #0f1512; --accent-soft: #23332b; --band: #202925; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: 72px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  h1, h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; letter-spacing: .01em; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }

  /* Lock screen */
  .lock { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .lock form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; }
  .lock h1 { font-size: 2.1rem; margin: 0 0 4px; }
  .lock p { margin: 0 0 20px; color: var(--muted); }
  .lock input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  .lock input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lock .btn { width: 100%; margin-top: 12px; }
  .lock .error { color: #b3261e; min-height: 1.5em; margin: 10px 0 0; font-size: .9rem; }

  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn.secondary { background: var(--accent-soft); color: var(--accent); }

  /* App */
  header.top { padding: 28px 16px 12px; text-align: center; }
  header.top h1 { font-size: 2.2rem; margin: 0; line-height: 1.1; }
  header.top p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; overflow-x: auto; padding: 10px 16px 12px; background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-group { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .tab-group + .tab-group { padding-left: 14px; border-left: 1px solid var(--line); }
  .tab-label { font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-left: 4px; }
  .tab-row { display: flex; gap: 8px; }
  @media (min-width: 1100px) { .tabs { justify-content: safe center; } }
  /* Phones: one compact row per group, label on the left, each row scrolls on its own. */
  @media (max-width: 760px) {
    .tabs { flex-direction: column; gap: 6px; overflow: visible; padding: 8px 0 10px; }
    .tab-group { flex-direction: row; align-items: center; gap: 8px; min-width: 0; }
    .tab-group + .tab-group { padding-left: 0; border-left: 0; }
    .tab-label { flex: 0 0 76px; padding-left: 16px; box-sizing: content-box; font-size: .62rem; white-space: nowrap; }
    .tab-row { overflow-x: auto; scrollbar-width: none; padding-right: 16px; min-width: 0; }
    .tab-row::-webkit-scrollbar { display: none; }
    .tabs a { padding: 6px 12px; font-size: .85rem; }
  }
  .tabs a { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: .9rem; font-weight: 500; white-space: nowrap; }
  .tabs a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  main { max-width: 820px; margin: 0 auto; padding: 8px 16px 48px; }
  section h2 { font-size: 2rem; margin: 20px 0 8px; }
  section h3 { font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 24px 0 8px; }
  section ul, section ol { padding-left: 1.4em; margin: 0; }
  section li { margin: 6px 0; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  tbody tr:nth-child(even) td { background: var(--band); }
  tbody tr:last-child td { border-bottom: 0; }
  td:first-child { white-space: nowrap; font-weight: 500; }
  .actions { display: flex; gap: 8px; margin: 12px 0; }
  .pdf-pages canvas { display: block; width: 100%; height: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .map-link { display: block; }
  .map-link img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); }
  footer { text-align: center; padding: 0 16px 32px; }
  footer button { background: none; border: 0; color: var(--muted); font: inherit; font-size: .85rem; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div id="lock" class="lock" hidden>
  <form id="lock-form" autocomplete="off">
    <h1>Maddie &amp; Michael</h1>
    <p>Wedding party details. Enter the password to continue.</p>
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus>
    <button class="btn" type="submit">Unlock</button>
    <p id="err" class="error" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <h1>Maddie &amp; Michael's Wedding Weekend</h1>
    <p>Thursday, Oct 22 - Saturday, Oct 24, 2026 &middot; In The Woods, Cartersville, GA</p>
  </header>
  <div id="content"></div>
  <footer><button id="forget" type="button">Lock this device</button></footer>
</div>

<script>
(() => {
  const STORE = "mm1024-key";
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = { get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(STORE, v); } catch (e) {} },
    del() { try { localStorage.removeItem(STORE); } catch (e) {} } };
  let vault, key;

  const decrypt = async (item) => new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(item.iv) }, key, b64(item.ct)));
  const blobUrl = async (item) => URL.createObjectURL(new Blob([await decrypt(item)], { type: item.type }));

  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(vault.salt), iterations: vault.iter, hash: "SHA-256" }, base,
      { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }

  async function open() {
    const html = new TextDecoder().decode(await decrypt(vault.html));
    document.getElementById("content").innerHTML = html;
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    setupTabs();
  }

  // One section visible at a time; the URL hash picks it, so links and the back button work.
  let pdfDone = false, mapDone = false;
  function setupTabs() {
    const tabs = [...document.querySelectorAll(".tabs a")];
    const show = () => {
      const id = (location.hash || "").slice(1);
      const target = document.getElementById(id) && tabs.some((t) => t.dataset.tab === id) ? id : tabs[0].dataset.tab;
      document.querySelectorAll("[data-section]").forEach((s) => { s.hidden = s.id !== target; });
      tabs.forEach((t) => {
        const on = t.dataset.tab === target;
        t.setAttribute("aria-current", on ? "true" : "false");
        if (on) t.scrollIntoView({ block: "nearest", inline: "center" });
      });
      if (target === "full-wedding-day-schedule") renderPdf();
      if (target === "venue-map") renderMap();
    };
    window.addEventListener("hashchange", () => { show(); window.scrollTo(0, 0); });
    show();
    document.querySelector('[data-open="schedule"]').addEventListener("click", async () => {
      window.open(await blobUrl(vault.schedule), "_blank");
    });
  }

  async function renderMap() {
    if (mapDone) return; mapDone = true;
    const url = await blobUrl(vault.map);
    document.getElementById("map-img").src = url;
    document.getElementById("map-link").href = url;
  }

  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }

  async function renderPdf() {
    if (pdfDone) return; pdfDone = true;
    const box = document.getElementById("pdf-pages");
    try {
      const CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      await loadScript(CDN + "pdf.min.js");
      pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + "pdf.worker.min.js";
      const doc = await pdfjsLib.getDocument({ data: await decrypt(vault.schedule) }).promise;
      box.innerHTML = "";
      const scale = Math.min(2.5, (window.devicePixelRatio || 1) * 1.6);
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const vp = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        canvas.setAttribute("aria-label", "Schedule page " + i);
        box.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      }
    } catch (e) {
      box.innerHTML = '<p class="muted">The schedule could not be shown here. Use Open PDF above.</p>';
    }
  }

  document.getElementById("lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    const btn = e.target.querySelector("button");
    err.textContent = "";
    btn.disabled = true; btn.textContent = "Unlocking...";
    try {
      key = await deriveKey(document.getElementById("pw").value);
      await open();
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      store.set(btoa(String.fromCharCode(...raw)));
    } catch (x) {
      err.textContent = "That password didn't work. Try again.";
    }
    btn.disabled = false; btn.textContent = "Unlock";
  });

  document.getElementById("forget").addEventListener("click", () => { store.del(); location.reload(); });

  (async () => {
    vault = await (await fetch("vault.json", { cache: "no-cache" })).json();
    const saved = store.get();
    if (saved) {
      try {
        key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
        await open();
        return;
      } catch (e) { store.del(); }
    }
    document.getElementById("lock").hidden = false;
    document.getElementById("pw").focus();
  })();
})();
</script>
</body>
</html>
